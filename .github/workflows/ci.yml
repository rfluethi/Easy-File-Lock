name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: |
          find protected secure-files -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpstan
      - name: Run PHPStan
        run: |
          phpstan analyze \
            --level=4 \
            --no-progress \
            protected/check-access.php \
            secure-files/config/secure-config.php \
            || true   # remove once a clean baseline is established
